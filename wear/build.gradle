plugins { id 'com.android.application' }
// Optional local key stays in ignored .env and never enters tracked source or build logs.
def localEnv = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) envFile.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
        def pair = trimmed.split('=', 2)
        localEnv.setProperty(pair[0].trim(), pair[1].trim())
    }
}
def bundledBusKey = groovy.json.JsonOutput.toJson(localEnv.getProperty('BUS_API_KEY', ''))
android {
    namespace 'kr.oganeungil.watch'
    compileSdk 35
    buildFeatures { buildConfig true }
    signingConfigs { debug { storeFile rootProject.file('tools/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    defaultConfig { applicationId 'kr.oganeungil.commute'; minSdk 30; targetSdk 35; versionCode 3; versionName '0.1.2'; buildConfigField 'String', 'BUS_API_KEY', bundledBusKey }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation project(':core')
    implementation 'androidx.wear.tiles:tiles:1.1.0'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
tasks.withType(Test).configureEach {
    ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
}

tasks.withType(Test).configureEach {
    def testHome = layout.buildDirectory.dir('test-home').get().asFile
    systemProperty 'user.home', testHome.absolutePath
    doFirst { testHome.mkdirs() }
}
