name: Build and publish APKs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Create development signing key
        run: ./scripts/prepare-dev-key.sh
      - name: Build APKs
        run: ./gradlew --no-daemon :core:domainChecks :wear:assembleDebug :phone:assembleDebug
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-build-${{ github.run_number }}
          path: |
            wear/build/outputs/apk/debug/wear-debug.apk
            phone/build/outputs/apk/debug/phone-debug.apk
